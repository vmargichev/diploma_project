version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: learnuniverse_postgres
    environment:
      POSTGRES_DB: learnuniverse_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
